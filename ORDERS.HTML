<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Order Management</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <header>
        <h1>Order Management</h1>
        <p>View and manage customer orders</p>
    </header>

    <main>

        <h2>Place Order</h2>

        <input
            type="text"
            id="customerName"
            placeholder="Customer name"
        >

        <br><br>

        <input
            type="text"
            id="orderProduct"
            placeholder="Product name"
        >

        <br><br>

        <input
            type="number"
            id="orderAmount"
            placeholder="Order amount"
        >

        <br><br>

        <button onclick="placeOrder()">
            Place Order
        </button>

        <hr>

        <h2>Order List</h2>

        <div id="orderList">
            <p>No orders placed yet.</p>
        </div>

    </main>


    <script>

        // Store orders
        let orders = [];


        // Place a new order
        function placeOrder() {

            let customer =
                document.getElementById("customerName").value;

            let product =
                document.getElementById("orderProduct").value;

            let amount =
                document.getElementById("orderAmount").value;


            if (customer === "" ||
                product === "" ||
                amount === "") {

                alert("Please enter all order details.");

                return;
            }


            let order = {
                customer: customer,
                product: product,
                amount: amount,
                status: "Order Placed"
            };


            orders.push(order);

            displayOrders();


            // Clear input fields
            document.getElementById("customerName").value = "";

            document.getElementById("orderProduct").value = "";

            document.getElementById("orderAmount").value = "";
        }


        // Display all orders
        function displayOrders() {

            let orderList =
                document.getElementById("orderList");

            orderList.innerHTML = "";


            for (let order of orders) {

                orderList.innerHTML +=
                    "<p>" +
                    "Customer: " + order.customer +
                    " | Product: " + order.product +
                    " | Amount: ₹" + order.amount +
                    " | Status: " + order.status +
                    "</p>";
            }
        }

    </script>

</body>

</html>
